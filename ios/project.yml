name: JejuFolklore
options:
  bundleIdPrefix: com.keepdev
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  JejuFolklore:
    build:
      targets:
        JejuFolklore: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0

targets:
  JejuFolklore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JejuFolklore/Sources
      - path: JejuFolklore/Resources/Assets.xcassets
      - path: JejuFolklore/Resources/Fonts
      - path: JejuFolklore/Resources/Covers
      - path: JejuFolklore/debug-route.gpx
        optional: true
    configFiles:
      Debug: JejuFolklore/Resources/Secrets.xcconfig
      Release: JejuFolklore/Resources/Secrets.xcconfig
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keepdev.jejufolklore
        INFOPLIST_FILE: JejuFolklore/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: JejuFolklore/Resources/JejuFolklore.entitlements
    info:
      path: JejuFolklore/Resources/Info.plist
      properties:
        CFBundleDisplayName: 놀멍봅서
        # 갈무리 픽셀 폰트 (SIL OFL 1.1). 등록이 빠지면 파일이 있어도 iOS가 못 찾고
        # 시스템 폰트로 조용히 폴백된다. tests/test_pixel_font_bundled.py 참조.
        UIAppFonts:
          - Galmuri9.ttf
          - Galmuri11.ttf
          - Galmuri11-Bold.ttf
          - Galmuri14.ttf
          # 시안이 쓰는 아이콘 폰트 (Material Icons, Apache-2.0)
          - MaterialIcons-Regular.ttf
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 스토어 심사 대비로 뺀 것들 (2026-09-09) — 리뷰 시트를 되살릴 때 함께 복구할 것.
        #   백그라운드 위치: 화면을 끈 채로 도착을 감지하려면 필요하지만 심사에서 사유를
        #     강하게 요구받는다. 도착 감지는 앱을 켜 둔 동안만 동작하는 것으로 충분하다.
        #   마이크·음성인식: PlaceReviewSheet에서만 쓰는데 그 화면에 도달할 경로가 없다.
        #     쓰지 않는 권한을 선언하면 그 자체가 리젝 사유다.
        NSLocationWhenInUseUsageDescription: "현재 위치에서 관광지까지 남은 거리를 보여 주고, 코스를 따라 이동할 때 도착을 안내하기 위해 위치를 사용합니다. 위치는 기기 안에서만 확인하며 서버로 보내지 않습니다."
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes:
          - comgooglemaps
        GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
