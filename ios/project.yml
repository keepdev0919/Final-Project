name: JejuFolklore
options:
  bundleIdPrefix: com.keepdev
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  JejuFolklore:
    build:
      targets:
        JejuFolklore: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0

targets:
  JejuFolklore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JejuFolklore/Sources
      - path: JejuFolklore/Resources/Assets.xcassets
      - path: JejuFolklore/Resources/GoogleService-Info.plist
        optional: true
      - path: JejuFolklore/debug-route.gpx
        optional: true
    configFiles:
      Debug: JejuFolklore/Resources/Secrets.xcconfig
      Release: JejuFolklore/Resources/Secrets.xcconfig
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: FirebaseSDK
        product: FirebaseFirestoreSwift
      - package: FirebaseSDK
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keepdev.jejufolklore
        INFOPLIST_FILE: JejuFolklore/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: JejuFolklore/Resources/JejuFolklore.entitlements
    info:
      path: JejuFolklore/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "관광지에 도착했을 때 준비된 이야기를 안내하기 위해 위치를 사용합니다. 위치는 기기 안에서만 확인하며 서버로 보내지 않습니다."
        NSLocationAlwaysAndWhenInUseUsageDescription: "화면이 꺼져 있거나 앱이 백그라운드일 때도 관광지 도착을 감지해 이야기를 안내하기 위해 위치 접근이 필요합니다. 위치는 기기 안에서만 확인하며 서버로 보내지 않습니다."
        UIBackgroundModes:
          - location
          - audio
        NSMicrophoneUsageDescription: "이야기를 들으며 음성으로 답하거나 리뷰를 남길 때 마이크를 사용합니다."
        NSSpeechRecognitionUsageDescription: "말한 내용을 글자로 바꾸기 위해 Apple 음성 인식을 사용합니다. 이 앱은 음성을 저장하지 않습니다."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes:
          - comgooglemaps
        GOOGLE_MAPS_API_KEY: $(GOOGLE_MAPS_API_KEY)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.107241453785-do85fcu2l0i2fdt0805tb646vhgv5g9f
